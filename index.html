<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CREDA Vision AI</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f3f4f6;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      flex: 0 0 auto;
      padding: 14px 20px;
      background: #0f172a;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    header span {
      font-size: 12px;
      opacity: 0.7;
    }
    main {
      flex: 1 1 auto;
      min-height: 0;
      padding: 12px;
    }
    .frame-wrap {
      height: 100%;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <h1>CREDA Vision AI</h1>
    <span>Copilot Studio Demo</span>
  </header>
  <main>
    <div class="frame-wrap">
      <iframe
        src="https://copilotstudio.microsoft.com/environments/3b1e3639-5b06-ee6a-8903-9e3e0f5aa343/bots/creda_vision_ai_UrBUbi/webchat?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true"
        title="CREDA Vision AI Chat"
        allow="microphone; camera"></iframe>
    </div>
  </main>
</body>
</html>
